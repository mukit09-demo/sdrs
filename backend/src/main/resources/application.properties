# The only configuration file. One profile on purpose: every value below reads
# from the environment with a local-development default, so a deployment
# overrides variables rather than shipping a second copy of this file that
# drifts from it.
#
# Flat keys rather than YAML nesting, which means the full property path is on
# every line — greppable, and a key cannot be silently reparented by an
# indentation slip.

spring.application.name=sdrs-api

# --- Database ---------------------------------------------------------------
# Port 15432, not 5432 — see docker-compose.yml for why.
spring.datasource.url=${SDRS_DB_URL:jdbc:postgresql://localhost:15432/sdrs}
spring.datasource.username=${SDRS_DB_USERNAME:sdrs}
spring.datasource.password=${SDRS_DB_PASSWORD:sdrs}
spring.datasource.hikari.maximum-pool-size=${SDRS_DB_POOL_SIZE:10}

# Liquibase owns the schema. Hibernate's job here is to refuse to start when the
# entities and the changelog have drifted — never to "fix" the database itself,
# which is what `update` would do, silently and unrepeatably.
spring.jpa.hibernate.ddl-auto=validate

# No lazy loading during response rendering: a query that escapes the service
# layer is a bug, and this makes it fail instead of working by accident in
# development and N+1-ing in production.
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Migrations -------------------------------------------------------------
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Which contexts to run. The bundled news seed is tagged `seed`, so a deployment
# with real content sets this to `!seed` to apply the schema without the dummy
# articles.
spring.liquibase.contexts=${SDRS_LIQUIBASE_CONTEXTS:seed}

# --- Redis ------------------------------------------------------------------
spring.data.redis.host=${SDRS_REDIS_HOST:localhost}
spring.data.redis.port=${SDRS_REDIS_PORT:16379}
spring.data.redis.password=${SDRS_REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

spring.cache.type=redis

# --- Server -----------------------------------------------------------------
server.port=${SDRS_PORT:8085}
server.shutdown=graceful

# --- This application -------------------------------------------------------
sdrs.admin.username=${SDRS_ADMIN_USERNAME:admin}
sdrs.admin.password=${SDRS_ADMIN_PASSWORD:}

# Keep in step with CONTENT_REVALIDATE_SECONDS in both apps' .env.example.
sdrs.cache.ttl=${SDRS_CACHE_TTL:5m}

# --- Actuator ---------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Logging ----------------------------------------------------------------
# Appenders and rolling policy are in logback-spring.xml.
logging.level.root=${SDRS_LOG_LEVEL_ROOT:INFO}
logging.level.com.banyan.lab.sdrs=${SDRS_LOG_LEVEL_APP:INFO}

# Uncomment to see the generated SQL while working on a query.
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
