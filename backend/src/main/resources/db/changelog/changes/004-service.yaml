# Services. The in-house digital tools listed beside them on /services are
# code-edited in packages/shared/data/services.ts, not stored here.

databaseChangeLog:
  - changeSet:
      id: "004-00-create-service-sequence"
      author: "mukit09"
      comment: >-
        increment by 1 must match allocationSize = 1 on the entity's
        @SequenceGenerator. If they disagree Hibernate hands out ids the
        database has already issued, and not until a reserved band runs out —
        so it fails late, not on the first insert.
      changes:
        - createSequence:
            sequenceName: "service_id_seq"
            startValue: 1
            incrementBy: 1
            cycle: false
  - changeSet:
      id: "004-service-01-create-service"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "service"
            columns:
              - column:
                  name: "id"
                  type: "bigint"
                  constraints:
                    primaryKey: true
                    primaryKeyName: "pk_service"
                    nullable: false
              - column:
                  name: "slug"
                  type: "varchar(160)"
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: "uk_service_slug"
              - column:
                  name: "name"
                  type: "varchar(200)"
                  constraints:
                    nullable: false
              - column:
                  name: "category"
                  type: "varchar(60)"
                  constraints:
                    nullable: false
              - column:
                  name: "tagline"
                  type: "varchar(300)"
                  constraints:
                    nullable: false
              - column:
                  name: "description"
                  type: "varchar(2000)"
                  constraints:
                    nullable: false
              - column:
                  name: "image_url"
                  type: "varchar(600)"
              - column:
                  name: "image_alt"
                  type: "varchar(300)"
                  constraints:
                    nullable: false
              - column:
                  name: "image_seed"
                  type: "varchar(160)"
              - column:
                  name: "created_at"
                  type: "timestamp with time zone"
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "timestamp with time zone"
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
  - changeSet:
      id: "004-service-02-create-service-capability"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "service_capability"
            columns:
              - column:
                  name: "service_id"
                  type: "bigint"
                  constraints:
                    nullable: false
              - column:
                  name: "position"
                  type: "int"
                  constraints:
                    nullable: false
              - column:
                  name: "capability"
                  type: "varchar(300)"
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: "service_capability"
            columnNames: "service_id, position"
            constraintName: "pk_service_capability"
        - addForeignKeyConstraint:
            baseTableName: "service_capability"
            baseColumnNames: "service_id"
            referencedTableName: "service"
            referencedColumnNames: "id"
            constraintName: "fk_service_capability_owner"
            onDelete: "CASCADE"
  - changeSet:
      id: "004-service-03-create-service-related-market"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "service_related_market"
            columns:
              - column:
                  name: "service_id"
                  type: "bigint"
                  constraints:
                    nullable: false
              - column:
                  name: "position"
                  type: "int"
                  constraints:
                    nullable: false
              - column:
                  name: "market_slug"
                  type: "varchar(160)"
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: "service_related_market"
            columnNames: "service_id, position"
            constraintName: "pk_service_related_market"
        - addForeignKeyConstraint:
            baseTableName: "service_related_market"
            baseColumnNames: "service_id"
            referencedTableName: "service"
            referencedColumnNames: "id"
            constraintName: "fk_service_related_market_owner"
            onDelete: "CASCADE"
        - createIndex:
            tableName: "service_related_market"
            indexName: "idx_service_related_market_market_slug"
            columns:
              - column:
                  name: "market_slug"
