# Markets — the sectors the practice works in. Which projects are in a market
# is not stored here: project_market (005) is the one copy of that relation.

databaseChangeLog:
  - changeSet:
      id: "003-00-create-market-sequence"
      author: "mukit09"
      comment: >-
        increment by 1 must match allocationSize = 1 on the entity's
        @SequenceGenerator. If they disagree Hibernate hands out ids the
        database has already issued, and not until a reserved band runs out —
        so it fails late, not on the first insert.
      changes:
        - createSequence:
            sequenceName: "market_id_seq"
            startValue: 1
            incrementBy: 1
            cycle: false
  - changeSet:
      id: "003-market-01-create-market"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "market"
            columns:
              - column:
                  name: "id"
                  type: "bigint"
                  constraints:
                    primaryKey: true
                    primaryKeyName: "pk_market"
                    nullable: false
              - column:
                  name: "slug"
                  type: "varchar(160)"
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: "uk_market_slug"
              - column:
                  name: "name"
                  type: "varchar(200)"
                  constraints:
                    nullable: false
              - column:
                  name: "tagline"
                  type: "varchar(300)"
                  constraints:
                    nullable: false
              - column:
                  name: "description"
                  type: "varchar(2000)"
                  constraints:
                    nullable: false
              - column:
                  name: "film_url"
                  type: "varchar(600)"
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "timestamp with time zone"
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "timestamp with time zone"
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
  - changeSet:
      id: "003-market-02-create-market-capability"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "market_capability"
            columns:
              - column:
                  name: "market_id"
                  type: "bigint"
                  constraints:
                    nullable: false
              - column:
                  name: "position"
                  type: "int"
                  constraints:
                    nullable: false
              - column:
                  name: "capability"
                  type: "varchar(300)"
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: "market_capability"
            columnNames: "market_id, position"
            constraintName: "pk_market_capability"
        - addForeignKeyConstraint:
            baseTableName: "market_capability"
            baseColumnNames: "market_id"
            referencedTableName: "market"
            referencedColumnNames: "id"
            constraintName: "fk_market_capability_owner"
            onDelete: "CASCADE"
  - changeSet:
      id: "003-market-03-create-market-stat"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "market_stat"
            columns:
              - column:
                  name: "market_id"
                  type: "bigint"
                  constraints:
                    nullable: false
              - column:
                  name: "position"
                  type: "int"
                  constraints:
                    nullable: false
              - column:
                  name: "stat_value"
                  type: "varchar(60)"
                  constraints:
                    nullable: false
              - column:
                  name: "unit"
                  type: "varchar(40)"
              - column:
                  name: "label"
                  type: "varchar(300)"
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: "market_stat"
            columnNames: "market_id, position"
            constraintName: "pk_market_stat"
        - addForeignKeyConstraint:
            baseTableName: "market_stat"
            baseColumnNames: "market_id"
            referencedTableName: "market"
            referencedColumnNames: "id"
            constraintName: "fk_market_stat_owner"
            onDelete: "CASCADE"
