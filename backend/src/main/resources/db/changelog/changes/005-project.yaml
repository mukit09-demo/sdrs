# Projects. project_market and project_service are what the
# market and service filters match on, so both are indexed.
# Both are real many-to-manys: market_id references market and service_id
# references service, and deleting either removes its links rather than
# leaving them dangling.

databaseChangeLog:
  - changeSet:
      id: "005-00-create-project-sequence"
      author: "mukit09"
      comment: >-
        increment by 1 must match allocationSize = 1 on the entity's
        @SequenceGenerator. If they disagree Hibernate hands out ids the
        database has already issued, and not until a reserved band runs out —
        so it fails late, not on the first insert.
      changes:
        - createSequence:
            sequenceName: "project_id_seq"
            startValue: 1
            incrementBy: 1
            cycle: false
  - changeSet:
      id: "005-project-01-create-project"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "project"
            columns:
              - column:
                  name: "id"
                  type: "bigint"
                  constraints:
                    primaryKey: true
                    primaryKeyName: "pk_project"
                    nullable: false
              - column:
                  name: "slug"
                  type: "varchar(160)"
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: "uk_project_slug"
              - column:
                  name: "title"
                  type: "varchar(300)"
                  constraints:
                    nullable: false
              - column:
                  name: "location_city"
                  type: "varchar(160)"
              - column:
                  name: "location_country"
                  type: "varchar(160)"
                  constraints:
                    nullable: false
              - column:
                  name: "year"
                  type: "int"
                  constraints:
                    nullable: false
              - column:
                  name: "client"
                  type: "varchar(300)"
                  constraints:
                    nullable: false
              - column:
                  name: "summary"
                  type: "varchar(1000)"
                  constraints:
                    nullable: false
              - column:
                  name: "description"
                  type: "varchar(2000)"
                  constraints:
                    nullable: false
              - column:
                  name: "image_url"
                  type: "varchar(600)"
              - column:
                  name: "created_at"
                  type: "timestamp with time zone"
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "timestamp with time zone"
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
        - createIndex:
            tableName: "project"
            indexName: "idx_project_year"
            columns:
              - column:
                  name: "year"
  - changeSet:
      id: "005-project-02-create-project-stat"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "project_stat"
            columns:
              - column:
                  name: "project_id"
                  type: "bigint"
                  constraints:
                    nullable: false
              - column:
                  name: "position"
                  type: "int"
                  constraints:
                    nullable: false
              - column:
                  name: "stat_value"
                  type: "varchar(60)"
                  constraints:
                    nullable: false
              - column:
                  name: "unit"
                  type: "varchar(40)"
              - column:
                  name: "label"
                  type: "varchar(300)"
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: "project_stat"
            columnNames: "project_id, position"
            constraintName: "pk_project_stat"
        - addForeignKeyConstraint:
            baseTableName: "project_stat"
            baseColumnNames: "project_id"
            referencedTableName: "project"
            referencedColumnNames: "id"
            constraintName: "fk_project_stat_owner"
            onDelete: "CASCADE"
  - changeSet:
      id: "005-project-03-create-project-highlight"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "project_highlight"
            columns:
              - column:
                  name: "project_id"
                  type: "bigint"
                  constraints:
                    nullable: false
              - column:
                  name: "position"
                  type: "int"
                  constraints:
                    nullable: false
              - column:
                  name: "highlight"
                  type: "varchar(600)"
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: "project_highlight"
            columnNames: "project_id, position"
            constraintName: "pk_project_highlight"
        - addForeignKeyConstraint:
            baseTableName: "project_highlight"
            baseColumnNames: "project_id"
            referencedTableName: "project"
            referencedColumnNames: "id"
            constraintName: "fk_project_highlight_owner"
            onDelete: "CASCADE"
  - changeSet:
      id: "005-project-04-create-project-market"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "project_market"
            columns:
              - column:
                  name: "project_id"
                  type: "bigint"
                  constraints:
                    nullable: false
              - column:
                  name: "position"
                  type: "int"
                  constraints:
                    nullable: false
              - column:
                  name: "market_id"
                  type: "bigint"
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: "project_market"
            columnNames: "project_id, position"
            constraintName: "pk_project_market"
        - addUniqueConstraint:
            tableName: "project_market"
            columnNames: "project_id, market_id"
            constraintName: "uk_project_market"
        - addForeignKeyConstraint:
            baseTableName: "project_market"
            baseColumnNames: "project_id"
            referencedTableName: "project"
            referencedColumnNames: "id"
            constraintName: "fk_project_market_owner"
            onDelete: "CASCADE"
        - addForeignKeyConstraint:
            baseTableName: "project_market"
            baseColumnNames: "market_id"
            referencedTableName: "market"
            referencedColumnNames: "id"
            constraintName: "fk_project_market_market"
            onDelete: "CASCADE"
        - createIndex:
            tableName: "project_market"
            indexName: "idx_project_market_market_id"
            columns:
              - column:
                  name: "market_id"
  - changeSet:
      id: "005-project-05-create-project-service"
      author: "mukit09"
      changes:
        - createTable:
            tableName: "project_service"
            columns:
              - column:
                  name: "project_id"
                  type: "bigint"
                  constraints:
                    nullable: false
              - column:
                  name: "position"
                  type: "int"
                  constraints:
                    nullable: false
              - column:
                  name: "service_id"
                  type: "bigint"
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: "project_service"
            columnNames: "project_id, position"
            constraintName: "pk_project_service"
        - addUniqueConstraint:
            tableName: "project_service"
            columnNames: "project_id, service_id"
            constraintName: "uk_project_service"
        - addForeignKeyConstraint:
            baseTableName: "project_service"
            baseColumnNames: "project_id"
            referencedTableName: "project"
            referencedColumnNames: "id"
            constraintName: "fk_project_service_owner"
            onDelete: "CASCADE"
        - addForeignKeyConstraint:
            baseTableName: "project_service"
            baseColumnNames: "service_id"
            referencedTableName: "service"
            referencedColumnNames: "id"
            constraintName: "fk_project_service_service"
            onDelete: "CASCADE"
        - createIndex:
            tableName: "project_service"
            indexName: "idx_project_service_service_id"
            columns:
              - column:
                  name: "service_id"
